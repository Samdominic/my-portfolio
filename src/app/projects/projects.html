 <section id="projects" class="max-w-7xl mx-auto my-24 px-4">
    <h2 class="text-4xl font-bold mb-12 text-cyan-400 text-center">Projects</h2>
    <div class="grid md:grid-cols-2 gap-10">
      @for (project of projects(); track project.title){
        <div class="bg-gray-900/90 rounded-2xl shadow-xl p-8 flex flex-col border border-gray-800 hover:scale-105 hover:shadow-cyan-700/30 transition-transform duration-300">
          <h3 class="text-2xl font-semibold mb-3 text-cyan-300">{{ project.title }}</h3>
          <p class="text-gray-400 mb-6">{{ project.description }}</p>
          <div class="flex flex-wrap gap-2 mb-4">
            @for (tech of project.technologies; track tech){
              <span class="bg-cyan-800/80 text-cyan-100 px-3 py-1 rounded-full text-xs font-semibold shadow">{{ tech }}</span>
            }
          </div>
          <!-- No link, just technologies listed above -->
        </div>
    }
    </div>
  </section>
