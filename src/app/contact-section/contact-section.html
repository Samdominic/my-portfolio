<section id="contact"
    class="max-w-2xl mx-auto mt-10 mb-5 p-10 bg-gray-900/90 rounded-3xl shadow-2xl border border-gray-800 backdrop-blur-md">
    <h2 class="text-4xl font-bold mb-6 text-cyan-400">Contact</h2>
    <div class="flex justify-center mb-6">
      <a href="https://www.linkedin.com/in/sam-dominic-8a671724a/" target="_blank" rel="noopener noreferrer">
        <img ngSrc="/linkedin-logo.png" alt="LinkedIn" class="w-20 h-20 hover:scale-110 transition-transform" loading="eager" width="20" height="20" />
      </a>
    </div>
    <div class="flex items-center mb-6">
      <hr class="flex-grow border-gray-700" />
      <span class="mx-4 text-gray-400 font-semibold">or</span>
      <hr class="flex-grow border-gray-700" />
    </div>
    <form class="flex flex-col gap-6" (submit)="onSubmit($event)">
      <input name="name" type="text" placeholder="Your Name" required
        class="px-5 py-3 rounded bg-gray-800/80 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 text-lg" />
      <div class="h-4"></div>
      <input name="email" type="email" placeholder="Your Email" required
        class="px-5 py-3 rounded bg-gray-800/80 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 text-lg" />
      <div class="h-4"></div>
      <textarea name="message" placeholder="Your Message" rows="4" required
        class="px-5 py-3 rounded bg-gray-800/80 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 text-lg"></textarea>
      <div class="h-4"></div>
      <button type="submit"
        class="bg-cyan-500 hover:bg-cyan-400 text-white font-bold py-3 rounded transition text-lg shadow">Send
        Message</button>
    </form>
  </section>
